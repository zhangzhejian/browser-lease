[project]
name = "browser-lease"
version = "0.1.0"
description = "单机浏览器任务申报、隔离、查询与回收"
requires-python = ">=3.11"
dependencies = ["psutil>=7,<8"]

[project.scripts]
browser-lease = "browser_lease.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["browser_lease"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "websocket-client>=1.8,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["chrome: 启动专用无头 Chrome 的真实集成测试"]

[tool.ruff]
line-length = 100

